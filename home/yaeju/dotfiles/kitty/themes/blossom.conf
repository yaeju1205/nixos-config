# Blossom — a dark cherry-blossom terminal theme
#
# Palette derived from the blossom palette (a lower-chroma variant of the sakura color set).
#
# Install:
#   1. Save this file as ~/.config/kitty/themes/sakura.conf
#   2. kitty +kitten themes   (pick "Blossom")
#   or paste the color lines below into your kitty.conf.

name Blossom

# ---- base ----------------------------------------------------------------
background            #070707
foreground            #C7B7BA

selection_background  #3D393D
selection_foreground  #C7B7BA

cursor                #C7B7BA
cursor_text_color     #070707

url_color             #B28D9E
active_border_color   #B28D9E

# ---- tabs ---------------------------------------------------------------
active_tab_foreground   #070707
active_tab_background   #B28D9E
inactive_tab_foreground #A6989B
inactive_tab_background #252425

# ---- kitten marks (semantic colors) ------------------------------------
mark1 #A56661
mark2 #6C8778
mark3 #957F5F
mark4 #7B76A5

# ---- ANSI: normal -------------------------------------------------------
color0  #252425
color1  #A56661
color2  #6C8778
color3  #957F5F
color4  #7B76A5
color5  #AB7DAB
color6  #887A87
color7  #A6989B

# ---- ANSI: bright -------------------------------------------------------
color8  #5E585E
color9  #A56661
color10 #6C8778
color11 #957F5F
color12 #7B76A5
color13 #AB7DAB
color14 #887A87
color15 #C7B7BA
